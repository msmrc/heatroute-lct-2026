version: "3.8"

services:
  java-db:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heatroute}
      POSTGRES_USER: ${POSTGRES_USER:-heatroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heatroute_dev_only}
    volumes:
      - java-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  java-api:
    build:
      context: .
      dockerfile: infra/docker/backend-java.Dockerfile
    environment:
      HEATROUTE_JDBC_URL: jdbc:postgresql://java-db:5432/${POSTGRES_DB:-heatroute}
      HEATROUTE_DATABASE_USER: ${POSTGRES_USER:-heatroute}
      HEATROUTE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-heatroute_dev_only}
      HEATROUTE_UPLOAD_TMP: /var/lib/heatroute/tmp
    ports:
      - "${JAVA_API_BIND_ADDRESS:-127.0.0.1}:${JAVA_API_HOST_PORT:-18080}:8000"
    volumes:
      - java-artifacts:/var/lib/heatroute
    depends_on:
      java-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

volumes:
  java-postgres-data:
  java-artifacts:
