name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Verify Java 11 backend
        working-directory: apps/api
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Build pinned Java runtime image
        run: docker build -f infra/docker/backend.Dockerfile -t heatroute-api:ci .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
      - name: Install pinned docker-compose 1.29.2
        run: |
          mkdir -p .ci
          curl --fail --silent --show-error --location \
            https://github.com/docker/compose/releases/download/1.29.2/docker-compose-Linux-x86_64 \
            --output .ci/docker-compose
          echo 'f3f10cf3dbb8107e9ba2ea5f23c1d2159ff7321d16f0a23051d68d8e2547b323  .ci/docker-compose' \
            | sha256sum --check
          chmod +x .ci/docker-compose
          .ci/docker-compose --version | grep -q '1.29.2'
      - name: Validate Compose 1.29.2 model
        run: .ci/docker-compose config --quiet
      - name: Start clean Java application stack on Ubuntu 22
        run: |
          .ci/docker-compose up --build -d
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:8000/api/v1/health/ready >/dev/null \
                && curl --fail --silent http://localhost:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          .ci/docker-compose ps
          exit 1
      - name: Verify 50 concurrent official imports
        run: |
          node scripts/r9-concurrency.mjs \
            --base-url=http://localhost:8000 \
            --dataset=datasets/official/lct-2026.geojson \
            --users=50 \
            --queue-runs=false \
            --timeout-ms=600000 \
            --output=artifacts/r9-load-50-ci.json
      - name: Preserve 50-user measurement
        uses: actions/upload-artifact@v4
        with:
          name: r9-load-50-${{ github.sha }}
          path: artifacts/r9-load-50-ci.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify public and internal contracts
        run: |
          curl --fail --silent http://localhost:8000/api/v1/health/ready
          OPENAPI_JSON=$(curl --fail --silent http://localhost:8000/api/v1/openapi)
          printf '%s' "$OPENAPI_JSON" | grep -q '/api/v1/official/imports'
          printf '%s' "$OPENAPI_JSON" | jq -e '.paths["/api/v1/official/contracts/output.schema.json"] != null' >/dev/null
          for schema in input provided-dataset output; do
            curl --fail --silent "http://localhost:8000/api/v1/official/contracts/${schema}.schema.json" \
              | jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema" and .type == "object"' >/dev/null
          done
          curl --fail --silent http://localhost:5173/ | grep -q 'HeatRoute'
          IMPORT_JSON=$(curl --fail --silent -F "file=@datasets/official/lct-2026.geojson;type=application/geo+json" http://localhost:8000/api/v1/official/imports)
          IMPORT_ID=$(printf '%s' "$IMPORT_JSON" | jq -r '.id')
          test "$(printf '%s' "$IMPORT_JSON" | jq -r '.report.feature_count')" = "144"
          MAP_JSON=$(curl --fail --silent "http://localhost:8000/api/v1/official/imports/${IMPORT_ID}/map?minLon=37.60&minLat=55.68&maxLon=37.68&maxLat=55.72")
          test "$(printf '%s' "$MAP_JSON" | jq -r '.type')" = "FeatureCollection"
          test "$(printf '%s' "$MAP_JSON" | jq -r '[.features[].properties.object_type] | index("heat_network") != null')" = "true"
          RUN_JSON=$(curl --fail --silent -X POST "http://localhost:8000/api/v1/official/imports/${IMPORT_ID}/runs")
          RUN_ID=$(printf '%s' "$RUN_JSON" | jq -r '.id')
          JOB_ID=$(printf '%s' "$RUN_JSON" | jq -r '.job_id')
          # The official obstacle-aware calculation is intentionally exercised end to end.
          # Give the shared GitHub runner enough time for visibility-graph construction.
          for attempt in $(seq 1 360); do
            JOB_JSON=$(curl --fail --silent "http://localhost:8000/api/v1/official/jobs/${JOB_ID}")
            JOB_STATE=$(printf '%s' "$JOB_JSON" | jq -r '.state')
            if [ "$JOB_STATE" = "completed" ]; then break; fi
            if [ "$JOB_STATE" = "failed" ] || [ "$JOB_STATE" = "cancelled" ]; then
              printf '%s\n' "$JOB_JSON"
              exit 1
            fi
            sleep 1
          done
          if [ "$JOB_STATE" != "completed" ]; then printf '%s\n' "$JOB_JSON"; fi
          test "$JOB_STATE" = "completed"
          RESULT_JSON=$(curl --fail --silent "http://localhost:8000/api/v1/official/runs/${RUN_ID}")
          test "$(printf '%s' "$RESULT_JSON" | jq -r '.state')" = "completed"
          test "$(printf '%s' "$RESULT_JSON" | jq -r '.result.demand_count')" = "17"
          test "$(printf '%s' "$RESULT_JSON" | jq -r '.result.variants | length')" = "3"
          test "$(printf '%s' "$RESULT_JSON" | jq -r '.result.preferred_variant_id != null')" = "true"
          test "$(printf '%s' "$RESULT_JSON" | jq -r '[.result.variants[].valid] | any')" = "true"
          test "$(printf '%s' "$RESULT_JSON" | jq -r '.result as $result | [$result.variants[] | select(.id == $result.preferred_variant_id)][0].connected_demand_count')" = "17"
          test "$(printf '%s' "$RESULT_JSON" | jq -r '[.result.variants[].edges[] | (.coordinates | length) >= 2 and (.sections | length) >= 1 and .diameter != null and .flow_tph != null] | all')" = "true"
          test "$(printf '%s' "$RESULT_JSON" | jq -r '[.result.variants[].economics.calculated_cost > 0] | all')" = "true"
          test "$(printf '%s' "$RESULT_JSON" | jq -r '[.result.variants[].economics.complete == false] | all')" = "true"
          printf '%s' "$RESULT_JSON" | jq -c '{state, demand_count: .result.demand_count, preferred: .result.preferred_variant_id, variants: [.result.variants[] | {id, valid, connected_demand_count, calculated_cost: .economics.calculated_cost, economics_complete: .economics.complete}]}'
          EXPORT_STATUS=$(curl --silent --output /tmp/export-error.json --write-out '%{http_code}' "http://localhost:8000/api/v1/official/runs/${RUN_ID}/export")
          test "$EXPORT_STATUS" = "409"
          test "$(jq -r '.error.code' /tmp/export-error.json)" = "OFFICIAL_EXPORT_INCOMPLETE"
      - name: Verify restart recovery
        run: |
          .ci/docker-compose restart api
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://localhost:8000/api/v1/health/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/api/v1/health/ready
          RECOVERED_RUN=$(curl --fail --silent http://localhost:8000/api/v1/official/runs/latest)
          test "$(printf '%s' "$RECOVERED_RUN" | jq -r '.state')" = "completed"
          test "$(printf '%s' "$RECOVERED_RUN" | jq -r '.result.demand_count')" = "17"
      - name: Compose diagnostics
        if: always()
        run: |
          .ci/docker-compose ps
          .ci/docker-compose logs --no-color --tail 200
      - name: Stop application stack
        if: always()
        run: .ci/docker-compose down --timeout 120
