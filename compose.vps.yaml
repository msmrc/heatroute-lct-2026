services:
  db:
    command: ["postgres"]

  api:
    environment:
      HEATROUTE_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      HEATROUTE_DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      HEATROUTE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      HEATROUTE_UPLOAD_TMP: /var/lib/heatroute/tmp
      HEATROUTE_JOB_CONCURRENCY: ${HEATROUTE_JOB_CONCURRENCY:-2}

  gateway:
    image: caddy:2.11.3-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    environment:
      HEATROUTE_PUBLIC_HOST: ${HEATROUTE_PUBLIC_HOST:-130-49-150-217.sslip.io}
    ports:
      - "0.0.0.0:${PUBLIC_HTTP_PORT:-80}:80"
      - "0.0.0.0:${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
