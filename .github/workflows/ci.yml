name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Verify Java 11 backend
        working-directory: apps/api
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Build pinned Java runtime image
        run: docker build -f infra/docker/backend.Dockerfile -t heatroute-api:ci .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Start Java application stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Verify public and internal contracts
        run: |
          curl --fail --silent http://localhost:8000/api/v1/health/ready
          curl --fail --silent http://localhost:8000/v3/api-docs | grep -q '/api/v1/official/imports'
          curl --fail --silent http://localhost:5173/ | grep -q 'HeatRoute'
          IMPORT_JSON=$(curl --fail --silent -F "file=@datasets/official/lct-2026.geojson;type=application/geo+json" http://localhost:8000/api/v1/official/imports)
          IMPORT_ID=$(printf '%s' "$IMPORT_JSON" | jq -r '.id')
          test "$(printf '%s' "$IMPORT_JSON" | jq -r '.report.feature_count')" = "144"
          RUN_JSON=$(curl --fail --silent -X POST "http://localhost:8000/api/v1/official/imports/${IMPORT_ID}/runs")
          RUN_ID=$(printf '%s' "$RUN_JSON" | jq -r '.id')
          JOB_ID=$(printf '%s' "$RUN_JSON" | jq -r '.job_id')
          for attempt in $(seq 1 60); do
            JOB_JSON=$(curl --fail --silent "http://localhost:8000/api/v1/official/jobs/${JOB_ID}")
            JOB_STATE=$(printf '%s' "$JOB_JSON" | jq -r '.state')
            if [ "$JOB_STATE" = "completed" ]; then break; fi
            if [ "$JOB_STATE" = "failed" ] || [ "$JOB_STATE" = "cancelled" ]; then
              printf '%s\n' "$JOB_JSON"
              exit 1
            fi
            sleep 1
          done
          test "$JOB_STATE" = "completed"
          RESULT_JSON=$(curl --fail --silent "http://localhost:8000/api/v1/official/runs/${RUN_ID}")
          test "$(printf '%s' "$RESULT_JSON" | jq -r '.state')" = "completed"
          test "$(printf '%s' "$RESULT_JSON" | jq -r '.result.demand_count')" = "17"
          test "$(printf '%s' "$RESULT_JSON" | jq -r '.result.variants | length >= 1')" = "true"
      - name: Compose diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
      - name: Stop application stack
        if: always()
        run: docker compose down --timeout 120
