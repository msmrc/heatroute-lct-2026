name: ci

env:
  PYTHONPATH: apps/api/src

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: apps/backend-java/pom.xml

      - name: Verify Java 11 backend
        working-directory: apps/backend-java
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build pinned Java runtime image
        run: docker build -f infra/docker/backend-java.Dockerfile -t heatroute-backend-java:ci .

      - name: Validate docker-compose 1.29.2 compatible model
        run: docker compose -f compose.java.yaml config

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.10.3
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12.11

      - name: Install Python dependencies
        run: uv sync --frozen

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          uv run ruff check apps/api/src tests
          pnpm lint

      - name: Security audit
        run: uv run python scripts/security_audit.py

      - name: Typecheck
        run: |
          uv run mypy apps/api/src
          pnpm typecheck

      - name: Unit tests
        run: |
          uv run pytest -m "not integration"
          pnpm test

      - name: Production web build
        run: pnpm build

      - name: Verify generated OpenAPI is current
        run: |
          uv run python -m heatroute export-openapi
          git diff --exit-code -- packages/api-client/openapi.json

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.10.3
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv python install 3.12.11
          uv sync --frozen

      - name: Start application stack
        run: |
          install -d -m 0777 artifacts
          docker compose up --build -d

      - name: Wait for ready API
        run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://localhost:8000/api/v1/health/ready && exit 0
            sleep 2
          done
          exit 1

      - name: Integration tests and worker smoke
        run: |
          uv run alembic check
          uv run pytest -m integration
          uv run python -m heatroute worker-smoke

      - name: Compose diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Stop application stack
        if: always()
        run: docker compose down --timeout 120
