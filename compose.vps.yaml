name: heatroute

# VPS demo profile. It restores PostgreSQL durability, keeps stateful/internal
# services on loopback and puts a public gateway in front of the UI.
services:
  db:
    command: ["postgres"]
    environment:
      POSTGRES_INITDB_ARGS: ""

  migrate:
    environment: &vps-backend-environment
      HEATROUTE_ENV: development
      HEATROUTE_LOG_LEVEL: ${HEATROUTE_LOG_LEVEL:-INFO}
      HEATROUTE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      HEATROUTE_REDIS_URL: redis://redis:6379/0
      HEATROUTE_CELERY_BROKER_URL: redis://redis:6379/1
      HEATROUTE_CELERY_RESULT_BACKEND: redis://redis:6379/2
      HEATROUTE_ARTIFACT_ROOT: /var/lib/heatroute/artifacts
      HEATROUTE_DEMO_MODE: "true"
      HEATROUTE_SESSION_SECRET: ${HEATROUTE_SESSION_SECRET:?HEATROUTE_SESSION_SECRET is required}
      MPLCONFIGDIR: /tmp/matplotlib

  api:
    environment: *vps-backend-environment

  worker:
    environment: *vps-backend-environment

  scheduler:
    environment: *vps-backend-environment

  gateway:
    image: nginxinc/nginx-unprivileged:1.29.8-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    ports:
      - "0.0.0.0:${PUBLIC_HTTP_PORT:-80}:8080"
    volumes:
      - ./infra/nginx/vps-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
